---
- name: Debug Print Variables
  debug:
    msg: nodeports | selectattr("application", "match", "chores") | map(attribute="port")
  tags: debug

- name: Clean the RKE2 Cluster Node
  import_playbook: clean_system.yml
  tags: [ 'never', 'clean_system' ]

- name: Configure the RKE2 Cluster
  import_playbook: create_cluster.yml
  tags: create_cluster

- name: Deploy metalLB
  import_playbook: deploy_metallb.yml
  tags: deploy_metallb

- name: Configure Monitoring
  import_playbook: deploy_monitoring.yml
  tags: deploy_monitoring

- name: Deploy Wordpress
  import_playbook: deploy_wordpress.yml
  tags: deploy_wordpress

- name: Deploy Homepage
  import_playbook: deploy_homepage.yml
  tags: deploy_homepage

- name: Deploy xwiki
  import_playbook: deploy_xwiki.yml
  tags: deploy_xwiki