---
- name: Add Helm Repos
  kubernetes.core.helm_repository:
    name: "{{ item.name }}"
    repo_url: "{{ item.url}}"
    force_update: true
  loop:
    - { name: 'jetstack', url: ' https://charts.jetstack.io' }
    - { name: 'rancher-latest', url: 'https://releases.rancher.com/server-charts/latest' }
  become: yes
  become_user: dave  


- name: Deploy Cert Manager
  kubernetes.core.helm:
    name: rancher
    chart_ref: rancher-latest/rancher
    chart_version: 1.7.1
    release_namespace: cert-manager
    create_namespace: true
    set_values:
      - value: installCRD=true
        value_type: string
  become: yes
  become_user: dave

- name: Download Cert Manager yaml 
  get_url:
    url: https://github.com/jetstack/cert-manager/releases/download/v1.7.1/cert-manager.crds.yaml
    dest: /home/dave/rke2/playbooks/roles/cluster/files/cert-manager.crds.yaml

- name: Apply Cert Manager Config
  kubernetes.core.k8s:
    kubeconfig: /home/dave/rke2/rke2.yaml
    state: present
    src: /home/dave/rke2/playbooks/roles/cluster/files/cert-manager.crds.yaml


- name: Deploy Rancher
  kubernetes.core.helm:
    name: rancher
    chart_ref: rancher-latest/rancher
    release_namespace: cattle-system
    create_namespace: true
    set_values:
      - value: hostname=cluster.local
        value_type: string
      - value: bootstrapPassword=password 
        value_type: string
  become: yes
  become_user: dave