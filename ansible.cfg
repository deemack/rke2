[defaults]
inventory      = inventory                       # Default inventory file
roles_path     = ../roles                        # Relative path to roles directory
host_key_checking = False                        # Skip SSH host key verification
retry_files_enabled = False                      # Disable .retry file creation
timeout        = 30                              # SSH timeout in seconds
log_path       = ./logs/ansible.log              # Optional: centralized log file
#forks          = 10                              # Parallelism
#gathering      = smart                           # Efficient fact gathering
fact_caching   = jsonfile                        # Cache facts between runs
fact_caching_connection = ./facts_cache          # Where to store cached facts
deprecation_warnings = False                     # Clean output
