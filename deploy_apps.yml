---

- name: Debug Print Variables
  hosts: minipc
  tasks:
   - debug:
      msg: "{{ nodeports | selectattr('application', 'match', 'chores') | map(attribute='port') }}"
     tags: debug

- name: Clean the RKE2 Cluster Node
  import_playbook: playbooks/clean_system.yml
  tags: [ 'never', 'clean_system' ]

- name: Configure the RKE2 Cluster
  import_playbook: playbooks/create_cluster.yml
  tags: create_cluster

- name: Deploy metalLB
  import_playbook: playbooks/deploy_metallb.yml
  tags: deploy_metallb

- name: Configure Dashboard
  import_playbook: playbooks/deploy_dashboard.yml
  tags: deploy_dashboard

- name: Deploy Wordpress
  import_playbook: playbooks/deploy_wordpress.yml
  tags: deploy_wordpress

- name: Deploy Homepage
  import_playbook: playbooks/deploy_homepage.yml
  tags: deploy_homepage

- name: Deploy xwiki
  import_playbook: playbooks/deploy_xwiki.yml
  tags: deploy_xwiki

- name: Deploy samba
  import_playbook: playbooks/deploy_samba.yml
  tags: deploy_samba

- name: Deploy chores
  import_playbook: playbooks/deploy_chores.yml
  tags: deploy_chores