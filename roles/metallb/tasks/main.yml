- name: Fetch IP address of Host
  vars:
    command: "hostname -I | awk '{print $1}'"
  shell: "{{ command }}"
  register: host_ip

- name: Host IP
  debug:
    var: host_ip.stdout

- name: Download metalLB manifest
  get_url:
    url: https://raw.githubusercontent.com/metallb/metallb/v0.14.9/config/manifests/metallb-native.yaml
    dest: /tmp/metallb-native.yml
    mode: '0664'
  tags: metalLB

- name: Apply metalLB manifest to the cluster.
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    src: /tmp/metallb-native.yml
  tags: metalLB

- name: Create MetalLB IPAddressPool from template
  become: true
  template:
    src: ipaddresspool_metallb.j2
    dest: /tmp/ipaddresspool_metallb.yml

- name: Apply MetalLB IPAddressPool
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    src: /tmp/ipaddresspool_metallb.yml