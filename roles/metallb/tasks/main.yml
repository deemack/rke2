- name: Fetch IP address of Host
  vars:
    command: "hostname -I | awk '{print $1}'"
  shell: "{{ command }}"
  register: host_ip

- name: Host IP
  debug:
    var: host_ip.stdout

- name: Download metalLB manifest
  get_url:
    url: https://raw.githubusercontent.com/metallb/metallb/v0.14.9/config/manifests/metallb-native.yaml
    dest: /tmp/metallb-native.yml
    mode: '0664'
  tags: metalLB

- name: Apply metalLB manifest to the cluster.
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    src: /tmp/metallb-native.yml
  tags: metalLB

- name: Get metallb pod information
  k8s_info:
    kubeconfig: "{{ kubeconfig_path }}"
    kind: Pod
    name: "controller"
    namespace: "metallb-system"
  register: pod_info

- name: Check if pod is running
  set_fact:
    pod_running: "{{ pod_info.items[0].status.phase == 'Running' }}"

- name: Display pod status
  debug:
    msg: "Pod is running: {{ pod_running }}"

- name: Create MetalLB IPAddressPool from template
  become: true
  template:
    src: ipaddresspool_metallb.j2
    dest: /tmp/ipaddresspool_metallb.yml

- name: Apply MetalLB IPAddressPool
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    src: /tmp/ipaddresspool_metallb.yml