---
- name: Wait for xwiki pod to become ready
  shell: /bin/bash -c "{{ kubectl_path }} wait --namespace=xwiki --for=condition=Ready pods --selector app=xwiki-postgres --timeout=600s"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  register: xwiki_pod_ready

- debug: var=xwiki_pod_ready.stdout_lines

- name: Get xwiki backups
  find:
    paths: "/mnt/storage/xwiki/backup/"
  register: found_files

- name: Get latest backup file
  set_fact:
    latest_file: "{{ found_files.files | sort(attribute='mtime',reverse=true) | first }}"

- debug:
    msg: latest backup file is "{{ latest_file.path }}"

- name: Copy latest xwiki database backup file to postgres pod
  copy:
    src: "{{ latest_file.path }}"
    dest: /mnt/storage/xwiki/postgres/
    remote_src: true

- name: Restart xwiki pgsql deployment
  command:
    cmd: '"{{ kubectl_path }}" --kubeconfig "{{ kubeconfig_path }}" rollout restart -n xwiki deployment/xwiki-postgres'

- name: Wait for xwiki pod to become ready again
  command:
    cmd: '"{{ kubectl_path }}" --kubeconfig "{{ kubeconfig_path }}" wait --namespace=xwiki --for=condition=Ready pods --selector app=xwiki-postgres --timeout=600s'
  register: xwiki_pod_ready

- debug: var=xwiki_pod_ready.stdout_lines[-1]

- name: Get xwiki database pod name
  command:
    cmd: '"{{ kubectl_path }}" --kubeconfig "{{ kubeconfig_path }}" get pods -n xwiki -l=app=xwiki-postgres --sort-by=.metadata.creationTimestamp -o jsonpath='{.items[0].metadata.name}' --no-headers
  register: pod_pgsql

- debug:
    msg: xwiki db pod is "{{ pod_pgsql.stdout }}"

