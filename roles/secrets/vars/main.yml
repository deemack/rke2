secrets:
  - namespace: default
    name: db-user-pass
    type: generic
    data:
      - key: username
        value: devuser
      - key: password
        value: "SoSecretPass"
  - namespace: default
    name: my-docker-creds
    type: docker-registry
    data:
      hostname: docker.io
      username: myusername
      password: s00p3rs3kr3t!
      email: me@example.com
  - namespace: wordpress
    name: mysql-secret
    type: generic
    data:
      - key: ROOT
        value: root
      - key: ROOT_PASSWORD
        value: StrongRootPassword
      - key: DATABASE
        value: wordpress
      - key: USER
        value: wordpress
      - key: PASSWORD
        value: wordpress
  - namespace: xwiki
    name: xwiki-postgres-secret
    type: generic
    data:
      - key: POSTGRES_DB
        value: xwiki
      - key: POSTGRES_USER
        value: xwiki
      - key: POSTGRES_PASSWORD
        value: xwiki
  - namespace: xwiki
    name: xwiki-secret
    type: generic
    data:
      - key: DB_NAME
        value: xwiki
      - key: DB_USER
        value: xwiki
      - key: DB_PASSWORD
        value: xwiki
  - namespace: chores
    name: choresdb-secret  
    type: generic
    data:
      - key: ROOT
        value: root
      - key: ROOT_PASSWORD
        value: root
      - key: DATABASE
        value: cms
      - key: USER
        value: chores
      - key: PASSWORD
        value: chores