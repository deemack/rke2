namespace: wordpress
directories:
  - path: /mnt/storage/wordpress/mysql
    mode: '0755'
    owner: nobody
    group: nogroup
  - path: /mnt/storage/wordpress/wordpress
    mode: '0777'
    owner: nobody
    group: nogroup
persistent_volumes:
  - name: mysql
    path: /mnt/storage/wordpress/mysql
    capacity: 10Gi
  - name: wordpress
    path: /mnt/storage/wordpress/wordpress
    capacity: 10Gi
persistent_volume_claims:
  - name: mysql-pv-claim
    storage: 5Gi
  - name: wordpress-pv-claim
    storage: 5Gi
network:
  - name: wordpress
    app: wordpress
    port: 80
    targetPort: 80
    nodePort: 30051
