- name: Download Cert Manager yml
  get_url:
    url: https://github.com/jetstack/cert-manager/releases/download/v1.7.1/cert-manager.crds.yaml
    dest: /tmp/cert-manager.crds.yml

- name: Apply Cert Manager Config
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    src: /tmp/cert-manager.crds.yml

- name: Deploy Rancher
  kubernetes.core.helm:
    kubeconfig: "{{ kubeconfig_path }}"
    binary_path: "{{ helm_path }}"
    name: rancher
    chart_ref: rancher-latest/rancher
    release_namespace: cattle-system
    create_namespace: true
    force: true
    set_values:
      - value: hostname="{{ cluster_hostname }}"
      - value: bootstrapPassword="{{ bootstrap_password }}""
  notify: Stop and Disable firewalld