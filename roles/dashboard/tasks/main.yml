---
- name: Add Helm Repos
  kubernetes.core.helm_repository:
    name: "{{ item.name }}"
    repo_url: "{{ item.url}}"
    force_update: true
  loop:
    - { name: 'jetstack', url: ' https://charts.jetstack.io' }
    - { name: 'rancher-latest', url: 'https://releases.rancher.com/server-charts/latest' }
  become: true
  become_user: dave


- name: Deploy Cert Manager
  kubernetes.core.helm:
    kubeconfig: /home/dave/rke2/rke2.yml
    binary_path: /home/dave/bin/helm
    name: cert-manager
    chart_ref: jetstack/cert-manager
    chart_version: v1.7.1
    release_namespace: cert-manager
    create_namespace: true
  become: true
  become_user: dave


- name: Install release
  ansible.builtin.shell:
    set -o errexit
    set -o pipefail
    set -o nounset

    helm install {{ cert_manager_release_name }} {{ cert_manager_chart_name }}
    --namespace {{ cert_manager_namespace }}
    --version {{ cert_manager_chart_version }}
    {{ cert_manager_values_rendered }}

    exit 0
  run_once: true
  delegate_to: 127.0.0.1
  changed_when: false
  args:
    executable: "/bin/bash"

- name: Download Cert Manager yml
  get_url:
    url: https://github.com/jetstack/cert-manager/releases/download/v1.7.1/cert-manager.crds.yml
    dest: /home/dave/rke2/playbooks/roles/cluster/files/cert-manager.crds.yml

- name: Apply Cert Manager Config
  kubernetes.core.k8s:
    kubeconfig: /home/dave/rke2/rke2.yml
    state: present
    src: /home/dave/rke2/playbooks/roles/cluster/files/cert-manager.crds.yml

- name: Deploy Rancher
  kubernetes.core.helm:
    name: rancher
    chart_ref: rancher-latest/rancher
    release_namespace: cattle-system
    create_namespace: true
    force: true
    set_values:
      - value: hostname=cluster.local
      - value: bootstrapPassword=password
  become: true
  become_user: dave
  notify: Stop and Disable firewalld